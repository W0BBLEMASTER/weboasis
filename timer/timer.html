<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOas.is | CHRONOS_OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        :root {
            --theme-color: #00ff41;
        }

        body {
            background: #0a0a0a;
            color: var(--theme-color);
            font-family: 'Share+Tech+Mono', monospace;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        .container {
            padding: 50px;
            max-width: 900px;
            margin: auto;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 2px solid var(--theme-color);
            padding-bottom: 10px;
            text-shadow: 0 0 10px var(--theme-color);
        }

        .glitch {
            position: relative;
        }

        .glitch::before, .glitch::after {
            content: 'CHRONOS_OS';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--theme-color), 2px 2px #ff00c1;
            animation: glitch-anim2 1s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(31px, 9999px, 94px, 0); }
            100% { clip: rect(70px, 9999px, 71px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            100% { clip: rect(10px, 9999px, 30px, 0); }
        }

        .section {
            margin-top: 40px;
            background: rgba(0, 255, 65, 0.05);
            padding: 20px;
            border-left: 5px solid var(--theme-color);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li::before {
            content: "> ";
        }

        .footer {
            margin-top: 60px;
            font-size: 0.8rem;
            opacity: 0.5;
            text-align: center;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            text-decoration: none;
            transition: all 0.3s;
            background: transparent;
            cursor: pointer;
            font-family: 'Share+Tech+Mono', monospace;
            text-transform: uppercase;
            font-size: 1rem;
        }

        .btn:hover, .mode-btn.active {
            background: var(--theme-color);
            color: #000;
            box-shadow: 0 0 20px var(--theme-color);
        }

        /* Timer Specific Overrides */
        #timer-display {
            font-size: 4rem;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--theme-color);
            text-align: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            white-space: nowrap;
            width: 100%;
            pointer-events: none;
        }

        .hud-wrapper {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .hud-scanline::after {
            content: '';
            position: absolute;
            top: -50%;
            left: 0;
            width: 100%;
            height: 20%;
            background: linear-gradient(to bottom, transparent 0%, var(--theme-color) 50%, transparent 100%);
            opacity: 0.4;
            animation: scan-circle 2s linear infinite;
        }

        @keyframes scan-circle {
            0% { top: -20%; }
            100% { top: 120%; }
        }

        .hud-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .hud-ring circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .hud-ring .bg {
            stroke: var(--theme-color);
            opacity: 0.1;
        }

        .hud-ring .progress {
            stroke: var(--theme-color);
            stroke-dasharray: 973.89;
            stroke-dashoffset: 973.89;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px var(--theme-color));
        }

        .hud-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .input-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        input[type="number"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--theme-color);
            opacity: 0.3;
            color: var(--theme-color);
            font-family: 'Share+Tech+Mono', monospace;
            font-size: 1.2rem;
            width: 60px;
            text-align: center;
            outline: none;
            transition: opacity 0.3s;
        }

        input[type="number"]:focus {
            opacity: 1;
        }

        #native-picker-wrap {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--theme-color);
            padding: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
        }

        input[type="number"]:focus {
            border-bottom-color: #00ff41;
        }

        /* Remove arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #pomo-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            color: #ff0041;
            z-index: 100;
            background: #000;
            padding: 40px;
            border: 5px solid #ff0041;
            box-shadow: 0 0 100px #ff0041;
            animation: pulse 0.5s infinite;
            font-family: 'Share+Tech+Mono', monospace;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .glitch-red {
            text-shadow: 2px 0 #00fff9, -2px 0 #ff00c1;
        }
        
        .controls {
            text-align: center;
        }
        
        .mode-container {
            text-align: center;
        }
        
        .mode-btn {
            margin: 0 5px;
        }

    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="pomo-alert" class="glitch-red" onclick="dismissPomo()">PIVOT!</div>

    <div id="native-picker-wrap">
        <label for="timer-color">SYSTEM_HUE:</label>
        <input type="color" id="timer-color" value="#00ff41" 
            oninput="updateThemeColor(this.value)">
    </div>

    <div class="container">
        <h1 class="glitch">CHRONOS_OS</h1>
        
        <div class="section">
            <h3>[ SYSTEM: ACTIVE ]</h3>
            
            <div class="hud-wrapper">
                <div class="hud-scanline"></div>
                <svg class="hud-ring" viewBox="0 0 340 340">
                    <circle class="bg" cx="170" cy="170" r="155" />
                    <circle id="hud-progress" class="progress" cx="170" cy="170" r="155" />
                </svg>
                
                <svg class="hud-decor" viewBox="0 0 340 340">
                    <path d="M170 15 L170 25 M170 315 L170 325 M15 170 L25 170 M315 170 L325 170" stroke="#00ff41" stroke-width="2" opacity="0.5"/>
                    <circle cx="170" cy="170" r="165" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="10 20" opacity="0.2" />
                </svg>

                <div id="timer-display">45:00</div>
            </div>
            
            <div class="mode-container">
                <button class="btn mode-btn active" onclick="setMode('work')">WORK</button>
                <button class="btn mode-btn" onclick="setMode('break')">BREAK</button>
                <button class="btn mode-btn" onclick="setMode('nap')">NAP</button>
            </div>

            <div class="input-wrapper">
                <span>SET_TIME:</span>
                <input type="number" id="custom-hour" min="0" max="99" placeholder="HH" 
                    oninput="if(this.value.length > 2) this.value = this.value.slice(0,2); if(this.value.length === 2) document.getElementById('custom-min').focus(); setCustomTime()">
                <span style="font-size: 1.2rem; color: #00ff41;">:</span>
                <input type="number" id="custom-min" min="0" max="59" placeholder="MM" 
                    oninput="if(this.value.length > 2) this.value = this.value.slice(0,2); if(this.value.length === 2) document.getElementById('custom-sec').focus(); setCustomTime()">
                <span style="font-size: 1.2rem; color: #00ff41;">:</span>
                <input type="number" id="custom-sec" min="0" max="59" placeholder="SS" 
                    oninput="if(this.value.length > 2) this.value = this.value.slice(0,2); setCustomTime()">
            </div>
        </div>

        <div class="section">
            <h3>[ CONTROL_UNIT ]</h3>
            <div class="controls">
                <button class="btn" id="start-btn" onclick="toggleTimer()">START</button>
                <button class="btn" onclick="resetTimer()">RESET</button>
            </div>
            <p id="status-text" style="text-align: center; margin-top: 20px; letter-spacing: 2px;">SYSTEM: IDLE</p>
        </div>

        <div class="section">
            <h3>[ DATA_STREAM ]</h3>
            <ul id="system-log">
                <li>INITIALIZING CHRONOS_CORE...</li>
                <li>POMO_ENGINE: STANDBY</li>
            </ul>
        </div>

        <a href="../index.html" class="btn">RETURN TO DASHBOARD</a>

        <div class="footer">
            REVIVAL_CORE // CHRONOS_v1.1 // POMODORO_READY
        </div>
    </div>

    <script>
        let timeLeft;
        let timerId = null;
        let currentMode = localStorage.getItem('timerMode') || 'work';
        let isRunning = false;
        let totalTime = 45 * 60; // Initial total time

        const modes = {
            work: 45 * 60,
            break: 15 * 60,
            nap: 180 * 60
        };

        const HUD_CIRCUMFERENCE = 973.89;

        function updateHUD() {
            const hudProgress = document.getElementById('hud-progress');
            if (hudProgress && totalTime > 0) {
                const percentage = timeLeft / totalTime;
                const offset = HUD_CIRCUMFERENCE * (1 - percentage);
                hudProgress.style.strokeDashoffset = offset;
            }
        }

        function log(msg) {
            const logEl = document.getElementById('system-log');
            const newLi = document.createElement('li');
            newLi.textContent = msg;
            logEl.prepend(newLi);
            if (logEl.children.length > 3) logEl.lastElementChild.remove();
        }

        function setCustomTime() {
            const hrs = parseInt(document.getElementById('custom-hour').value) || 0;
            const mins = parseInt(document.getElementById('custom-min').value) || 0;
            const secs = parseInt(document.getElementById('custom-sec').value) || 0;
            
            if (hrs > 0 || mins > 0 || secs > 0) {
                timeLeft = (hrs * 3600) + (mins * 60) + secs;
                totalTime = timeLeft; // Update totalTime for HUD
                updateDisplay();
                updateHUD();
                log(`CUSTOM_DURATION_SET: ${hrs}H ${mins}M ${secs}S`);
                setStatus(`MODE: CUSTOM (${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')})`);
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            }
        }

        function setMode(mode) {
            currentMode = mode;
            localStorage.setItem('timerMode', mode);
            timeLeft = modes[mode];
            totalTime = timeLeft; // Sync totalTime
            updateDisplay();
            updateHUD();
            
            // UI Update
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(mode)) btn.classList.add('active');
            });

            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                document.getElementById('start-btn').innerText = 'START';
            }
            setStatus(`MODE: ${mode.toUpperCase()}`);
            log(`SWITCHED_TO: ${mode.toUpperCase()}`);
        }

        function updateDisplay() {
            const hrs = Math.floor(timeLeft / 3600);
            const mins = Math.floor((timeLeft % 3600) / 60);
            const secs = timeLeft % 60;
            const display = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('timer-display').innerText = display;
            document.title = `${display} | CHRONOS`;
            updateHUD();
        }

        function setStatus(msg) {
            document.getElementById('status-text').innerText = msg;
        }

        function toggleTimer() {
            const btn = document.getElementById('start-btn');
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                btn.innerText = 'START';
                setStatus('SYSTEM: PAUSED');
            } else {
                isRunning = true;
                btn.innerText = 'STOP';
                setStatus('SYSTEM: RUNNING');
                // Ensure totalTime is valid on start
                if (totalTime <= 0) totalTime = timeLeft; 
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        triggerPomo();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            document.getElementById('start-btn').innerText = 'START';
            timeLeft = modes[currentMode];
            totalTime = timeLeft; // Reset totalTime
            updateDisplay();
            updateHUD();
            setStatus('SYSTEM: RESET');
            document.getElementById('pomo-alert').style.display = 'none';
        }

        function triggerPomo() {
            isRunning = false;
            document.getElementById('start-btn').innerText = 'START';
            setStatus('SYSTEM: POMO_REQUIRED');
            const alert = document.getElementById('pomo-alert');
            alert.style.display = 'block';
            
            // Beep simulation or just visual for now
            console.log("POMO!");
            
            // Auto hide alert after 10s or on reset
            setTimeout(() => {
                // alert.style.display = 'none';
            }, 10000);
        }

        // Init
        setMode('work');

        function updateThemeColor(color) {
            document.documentElement.style.setProperty('--theme-color', color);
            localStorage.setItem('timer-color', color);
            const picker = document.getElementById('timer-color');
            if (picker && picker.value !== color) picker.value = color;
            log(`SYSTEM_HUE_CALIBRATED: ${color}`);
        }

        function dismissPomo() {
            const alert = document.getElementById('pomo-alert');
            if (alert.style.display === 'block') {
                alert.style.display = 'none';
                log("[ ALERT_CLEARED: MANUAL_OVERRIDE ]");
                resetTimer();
            }
        }

        // Global Enter Key Listener
        document.addEventListener('keydown', (e) => {
            // Bypass if color picker is focused
            if (e.target.id === 'timer-color') return;

            if (e.key === 'Enter') {
                e.preventDefault(); 
                if (document.getElementById('pomo-alert').style.display === 'block') {
                    dismissPomo();
                    return;
                }
                if (['custom-hour', 'custom-min', 'custom-sec'].includes(document.activeElement.id)) {
                    setCustomTime();
                }
                if (document.activeElement && document.activeElement.tagName !== 'BODY') {
                    document.activeElement.blur();
                }
                toggleTimer();
            }
        });

        // Initialize Theme
        const savedColor = localStorage.getItem('timer-color') || '#00ff41';
        updateThemeColor(savedColor);
    </script>
</body>
</html>
